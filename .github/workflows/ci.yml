name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install swtpm (TPM end-to-end tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swtpm
      - run: go vet ./...
      - run: go test ./...
