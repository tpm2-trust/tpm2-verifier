name: Release

on:
  push:
    tags:
      - "*"

jobs:
  # The unit tests once, here; the package builds below then skip their own
  # run of the same tests (makepkg --nocheck, DEB_BUILD_OPTIONS=nocheck).
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-latest

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The TPM tests run against swtpm; without it they skip themselves.
      - name: Install swtpm
        run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools

      - name: Run unit tests
        run: go test ./...

  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      version_clean: ${{ steps.get_version.outputs.VERSION_CLEAN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/go-latest

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_CLEAN=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CLEAN=${VERSION_CLEAN}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist

          # -w drops the DWARF data; the symbol table stays (no -s):
          # govulncheck reads it to tell which functions the binary holds.
          VERSION=${{ steps.get_version.outputs.VERSION }}
          LDFLAGS="-w -X main.version=${VERSION}"

          # Pure Go, cgo-free: static binaries for every platform.
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            OUT="dist/tpm2-verifier-${GOOS}-${GOARCH}"
            [[ "$GOOS" == windows ]] && OUT="${OUT}.exe"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "${LDFLAGS}" -o "$OUT" ./cmd/tpm2-verifier
            go version -m "$OUT" | grep -q 'CGO_ENABLED=0' || { echo "$OUT built with cgo" >&2; exit 1; }
          done

          ./dist/tpm2-verifier-linux-amd64 version | grep -qx "tpm2-verifier ${VERSION}" || {
            echo "ERROR: the binary does not report version ${VERSION}"; exit 1; }

      # Only vendor data signed by a key in manifest/allowed_signers is
      # released: sign ekroots/vendors/MANIFEST before tagging.
      - name: Verify and pack the vendor data
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          ./dist/tpm2-verifier-linux-amd64 store verify -store ekroots/vendors
          git archive --format=tar.gz -o "dist/tpm2-verifier-vendors-${VERSION}.tar.gz" HEAD:ekroots vendors
          tar -tzf "dist/tpm2-verifier-vendors-${VERSION}.tar.gz"

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          retention-days: 1

  build-archlinux:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: read

    steps:
      - name: Update system and install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git go namcap pacman-contrib

      - name: Create build user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix ownership for build user
        run: |
          chown -R builder:builder .

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_CLEAN=${VERSION#v}
          # An Arch pkgver may not contain '-', but a prerelease tag can.
          PKGVER=${VERSION_CLEAN//-/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CLEAN=${VERSION_CLEAN}" >> $GITHUB_OUTPUT
          echo "PKGVER=${PKGVER}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version and checksums
        run: |
          cd packaging/aur
          PKGVER=${{ steps.get_version.outputs.PKGVER }}
          TAG=${{ steps.get_version.outputs.VERSION }}

          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s|^_tag=.*|_tag=${TAG}|" PKGBUILD

          grep -q "^pkgver=${PKGVER}$" PKGBUILD || { echo "ERROR: pkgver not set"; exit 1; }
          grep -q "^_tag=${TAG}$" PKGBUILD || { echo "ERROR: _tag not set"; exit 1; }

          # Replaces the SKIP placeholder with the real tarball hash.
          chown builder:builder .
          sudo -u builder updpkgsums
          grep -q "SKIP" PKGBUILD && { echo "ERROR: sha256sums still SKIP"; exit 1; }

          cat PKGBUILD

      # pacman's go may be a release behind go.dev; GOTOOLCHAIN names the
      # current one, which go fetches (checked against sum.golang.org).
      - name: Build package
        run: |
          cd packaging/aur
          GO=$(curl -fsS 'https://go.dev/VERSION?m=text' | head -1)
          [[ "$GO" =~ ^go[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "go.dev answered '$GO'" >&2; exit 1; }
          sudo -u builder env GOTOOLCHAIN="$GO" makepkg --noconfirm --syncdeps --rmdeps --clean --nocheck
          echo "GO=$GO" >> "$GITHUB_ENV"
          if ! ls *.pkg.tar.zst >/dev/null 2>&1; then
            echo "ERROR: No package file was created"
            exit 1
          fi

      - name: Check package with namcap
        run: |
          cd packaging/aur
          namcap PKGBUILD *.pkg.tar.zst | tee namcap.log
          if grep -q '^.*E: ' namcap.log; then
            echo "ERROR: namcap reported errors"
            exit 1
          fi

      - name: Validate package contents
        run: |
          cd packaging/aur
          PKGVER=${{ steps.get_version.outputs.PKGVER }}

          MAIN_PACKAGE=$(ls tpm2-verifier-*.pkg.tar.zst | grep -v debug | head -1)
          if [[ -z "$MAIN_PACKAGE" ]]; then
            echo "ERROR: No main package found"
            ls -la *.pkg.tar.zst
            exit 1
          fi

          case "$MAIN_PACKAGE" in
            tpm2-verifier-${PKGVER}-*) ;;
            *) echo "ERROR: ${MAIN_PACKAGE} does not carry version ${PKGVER}"; exit 1 ;;
          esac

          echo "Validating package: $MAIN_PACKAGE"
          mkdir -p /tmp/package-test
          tar -xf "$MAIN_PACKAGE" -C /tmp/package-test

          for path in \
            usr/bin/tpm2-verifier \
            usr/share/doc/tpm2-verifier/README.md \
            usr/share/licenses/tpm2-verifier/LICENSE \
            usr/share/tpm2-verifier/vendors/MANIFEST \
            usr/share/tpm2-verifier/vendors/MANIFEST.sig
          do
            if [[ ! -e "/tmp/package-test/${path}" ]]; then
              echo "ERROR: ${path} missing from the package"
              exit 1
            fi
          done

          if [[ ! -x "/tmp/package-test/usr/bin/tpm2-verifier" ]]; then
            echo "ERROR: tpm2-verifier binary not executable"
            exit 1
          fi

          "/tmp/package-test/usr/bin/tpm2-verifier" version -store /tmp/package-test/usr/share/tpm2-verifier/vendors
          "/tmp/package-test/usr/bin/tpm2-verifier" store verify -store /tmp/package-test/usr/share/tpm2-verifier/vendors

          # Built with the current Go release, not pacman's.
          BUILT=$(go version -m /tmp/package-test/usr/bin/tpm2-verifier | head -1 | awk '{print $2}')
          [[ "$BUILT" == "$GO" ]] || { echo "ERROR: built with $BUILT, the current release is $GO"; exit 1; }

      - name: Create package checksum
        run: |
          cd packaging/aur
          sha256sum tpm2-verifier-*.pkg.tar.zst | grep -v debug > package-checksums.txt || sha256sum tpm2-verifier-*.pkg.tar.zst > package-checksums.txt

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archlinux-package
          path: |
            packaging/aur/tpm2-verifier-[0-9]*.pkg.tar.zst
            packaging/aur/package-checksums.txt
            packaging/aur/PKGBUILD
          retention-days: 1

  build-debian:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: read

    steps:
      # Debian's golang-go is a major behind; the package is built with the
      # current Go release from go.dev.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper dpkg-dev file git lintian wget xz-utils
          GO=$(wget -qO- 'https://go.dev/VERSION?m=text' | head -1)
          wget -q "https://go.dev/dl/${GO}.linux-amd64.tar.gz"
          echo "$(wget -qO- "https://dl.google.com/go/${GO}.linux-amd64.tar.gz.sha256")  ${GO}.linux-amd64.tar.gz" | sha256sum -c -
          tar -C /usr/local -xzf "${GO}.linux-amd64.tar.gz"
          rm "${GO}.linux-amd64.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record the toolchain
        run: |
          go version
          echo "go directive in go.mod: $(awk '/^go /{print $2}' go.mod)"

      - name: Set package version from tag
        id: get_version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=${GITHUB_REF#refs/tags/}

          # Same mapping as a local build, so tagged and untagged builds
          # cannot drift apart. On a tag this yields the bare version.
          VERSION_DEB=$(packaging/deb-version.sh)

          sed -i "1s/^tpm2-verifier (.*)/tpm2-verifier (${VERSION_DEB})/" debian/changelog
          head -1 debian/changelog
          grep -q "^tpm2-verifier (${VERSION_DEB})" debian/changelog || {
            echo "ERROR: could not set changelog version to ${VERSION_DEB}"
            exit 1
          }

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_DEB=${VERSION_DEB}" >> $GITHUB_OUTPUT

      # Vendoring here is what makes the emitted source package build offline.
      - name: Vendor dependencies
        run: |
          go mod vendor
          test -f vendor/modules.txt

      - name: Build source and binary packages
        run: |
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc

      - name: Collect artifacts
        run: |
          mkdir -p debpkg
          cp ../tpm2-verifier_*.deb ../tpm2-verifier_*.dsc ../tpm2-verifier_*.tar.xz debpkg/
          ls -la debpkg/

      - name: Run lintian
        run: |
          lintian --no-tag-display-limit ../tpm2-verifier_*.changes || \
            echo "lintian findings above (non-fatal)"

      - name: Validate package contents
        run: |
          DEB=$(ls debpkg/tpm2-verifier_*.deb | head -1)
          echo "Validating ${DEB}"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

          for path in \
            ./usr/bin/tpm2-verifier \
            ./usr/share/doc/tpm2-verifier/copyright \
            ./usr/share/tpm2-verifier/vendors/MANIFEST \
            ./usr/share/tpm2-verifier/vendors/MANIFEST.sig
          do
            dpkg-deb -c "$DEB" | awk '{print $NF}' | grep -qx "$path" || {
              echo "ERROR: ${path} missing from the package"
              exit 1
            }
          done

          mkdir -p /tmp/debcheck
          dpkg-deb -x "$DEB" /tmp/debcheck
          file /tmp/debcheck/usr/bin/tpm2-verifier
          file /tmp/debcheck/usr/bin/tpm2-verifier | grep -q "statically linked" || {
            echo "ERROR: the packaged binary is not statically linked"
            exit 1
          }
          /tmp/debcheck/usr/bin/tpm2-verifier version -store /tmp/debcheck/usr/share/tpm2-verifier/vendors
          /tmp/debcheck/usr/bin/tpm2-verifier store verify -store /tmp/debcheck/usr/share/tpm2-verifier/vendors

      - name: Create package checksums
        run: |
          cd debpkg
          sha256sum tpm2-verifier_* > debian-checksums.txt
          cat debian-checksums.txt

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: debpkg/
          retention-days: 1

  release:
    needs: [build-binaries, build-archlinux, build-debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist/

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: archlinux-package
          path: archlinux/

      # Not 'debian/': that would collide with the packaging directory in the checkout.
      - name: Download Debian package artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: debpkg/

      - name: Get package filenames
        id: package_info
        run: |
          PACKAGE_FILE=$(ls archlinux/tpm2-verifier-*.pkg.tar.zst | grep -v debug | head -1 | xargs basename)
          DEB_FILE=$(ls debpkg/tpm2-verifier_*.deb | head -1 | xargs basename)
          DSC_FILE=$(ls debpkg/tpm2-verifier_*.dsc | head -1 | xargs basename)
          SRC_FILE=$(ls debpkg/tpm2-verifier_*.tar.xz | head -1 | xargs basename)
          for f in "$PACKAGE_FILE" "$DEB_FILE" "$DSC_FILE" "$SRC_FILE"; do
            if [[ -z "$f" ]]; then
              echo "ERROR: a package artifact is missing"
              ls -la archlinux/ debpkg/
              exit 1
            fi
          done
          echo "PACKAGE_FILE=${PACKAGE_FILE}" >> $GITHUB_OUTPUT
          echo "DEB_FILE=${DEB_FILE}" >> $GITHUB_OUTPUT
          echo "DSC_FILE=${DSC_FILE}" >> $GITHUB_OUTPUT
          echo "SRC_FILE=${SRC_FILE}" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=${{ needs.build-binaries.outputs.version }}
          PACKAGE_FILE=${{ steps.package_info.outputs.PACKAGE_FILE }}
          DEB_FILE=${{ steps.package_info.outputs.DEB_FILE }}
          DSC_FILE=${{ steps.package_info.outputs.DSC_FILE }}
          SRC_FILE=${{ steps.package_info.outputs.SRC_FILE }}

          ASSETS=(dist/tpm2-verifier-* dist/checksums.txt
                  "archlinux/${PACKAGE_FILE}" archlinux/package-checksums.txt
                  "debpkg/${DEB_FILE}" "debpkg/${DSC_FILE}" "debpkg/${SRC_FILE}" debpkg/debian-checksums.txt)

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} exists, uploading all artifacts..."
            gh release upload "${VERSION}" "${ASSETS[@]}" --clobber
            exit 0
          fi

          cat > release_notes.md <<EOF
          ## Release ${VERSION}

          ### Downloads

          | File | Platform |
          |------|----------|
          | \`tpm2-verifier-linux-amd64\`, \`tpm2-verifier-linux-arm64\` | Linux (static) |
          | \`tpm2-verifier-windows-amd64.exe\` | Windows (TBS) |
          | \`tpm2-verifier-darwin-amd64\`, \`tpm2-verifier-darwin-arm64\` | macOS (files, bundles, swtpm) |
          | \`tpm2-verifier-vendors-${VERSION}.tar.gz\` | vendor data for the binaries (\`vendors/\`, signed MANIFEST) |
          | \`${PACKAGE_FILE}\` | Arch Linux |
          | \`${DEB_FILE}\` | Debian 13 "trixie" (and Ubuntu) |
          | \`${DSC_FILE}\` + \`${SRC_FILE}\` | Debian source package (vendored, builds offline) |

          ### Installation

          #### Binary
          \`\`\`bash
          wget https://github.com/${GH_REPO}/releases/download/${VERSION}/tpm2-verifier-linux-amd64
          sha256sum -c --ignore-missing <(wget -qO- https://github.com/${GH_REPO}/releases/download/${VERSION}/checksums.txt)
          sudo install -m755 tpm2-verifier-linux-amd64 /usr/local/bin/tpm2-verifier
          # The vendor data: tpm2-verifier uses ./vendors, or the directory given with -store.
          wget https://github.com/${GH_REPO}/releases/download/${VERSION}/tpm2-verifier-vendors-${VERSION}.tar.gz
          tar -xzf tpm2-verifier-vendors-${VERSION}.tar.gz
          tpm2-verifier store verify
          \`\`\`

          #### Arch Linux
          \`\`\`bash
          wget https://github.com/${GH_REPO}/releases/download/${VERSION}/${PACKAGE_FILE}
          sudo pacman -U ${PACKAGE_FILE}
          \`\`\`

          #### Debian / Ubuntu
          \`\`\`bash
          wget https://github.com/${GH_REPO}/releases/download/${VERSION}/${DEB_FILE}
          sudo apt install ./${DEB_FILE}
          \`\`\`

          #### Go
          \`\`\`bash
          go install github.com/${GH_REPO}/cmd/tpm2-verifier@${VERSION}
          \`\`\`
          plus the vendor data as for the binary.

          Then, in the directory that contains \`vendors/\`: \`sudo tpm2-verifier info -prove\`.
          The packages install the vendor data to \`/usr/share/tpm2-verifier/vendors\`:
          \`sudo tpm2-verifier info -prove -store /usr/share/tpm2-verifier/vendors\`
          EOF

          FLAGS=()
          if [[ "$VERSION" == *"-"* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${VERSION}" --title "Release ${VERSION}" --notes-file release_notes.md "${FLAGS[@]}" "${ASSETS[@]}"

      - name: Release summary
        run: |
          VERSION=${{ needs.build-binaries.outputs.version }}
          {
            echo "## Release ${VERSION}"
            echo
            echo "| Artifact | Size |"
            echo "|---|---|"
            for f in dist/* archlinux/*.pkg.tar.zst debpkg/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-aur:
    needs: [build-archlinux, release]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: read
    # Prereleases stay off AUR; it carries one current version per package.
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git openssh

      - name: Download the PKGBUILD that was actually built
        uses: actions/download-artifact@v8
        with:
          name: archlinux-package
          path: built/

      - name: Configure AUR SSH access
        id: ssh
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; not publishing to AUR"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Absolute paths only: ssh expands '~' from the passwd entry, not from
          # $HOME, and a container job sets HOME=/github/home. They disagree.
          install -d -m 700 /opt/aur-ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /opt/aur-ssh/key
          chmod 600 /opt/aur-ssh/key

          # Pinned, not scanned: ssh-keyscan trusts whatever answers on the day.
          cat > /opt/aur-ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          chmod 644 /opt/aur-ssh/known_hosts

          # Expect SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          ssh-keygen -lf /opt/aur-ssh/known_hosts

      - name: Publish to AUR
        if: steps.ssh.outputs.skip != 'true'
        run: |
          useradd -m builder
          TAG=${GITHUB_REF#refs/tags/}

          export GIT_SSH_COMMAND="ssh -i /opt/aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/opt/aur-ssh/known_hosts -o StrictHostKeyChecking=yes"

          # Clone outside the mounted workspace, and give git an unambiguous
          # config home: it reads ~ from the passwd entry, as ssh does.
          export HOME=/root
          git config --global --add safe.directory '*'
          git config --global init.defaultBranch master

          rm -rf /tmp/aur-repo
          git clone ssh://aur@aur.archlinux.org/tpm2-verifier.git /tmp/aur-repo
          cd /tmp/aur-repo

          # An AUR repository holds only these two files.
          cp "$GITHUB_WORKSPACE/built/PKGBUILD" PKGBUILD
          chown -R builder:builder .
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

          PKGVER=$(awk -F' = ' '/^\tpkgver = /{print $2}' .SRCINFO)
          if [ "v${PKGVER}" != "$TAG" ] && [ "${PKGVER}" != "${TAG#v}" ]; then
            echo "ERROR: .SRCINFO pkgver '${PKGVER}' does not match tag '${TAG}'"
            exit 1
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "AUR is already up to date for ${TAG}; nothing to push."
            exit 0
          fi

          git commit -m "Update to ${TAG}"
          git push origin master
          echo "Published ${TAG} to AUR."
